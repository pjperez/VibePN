# VibePN daemon configuration.
#
# Identity: a self-signed X.509 cert/key pair generated by `vpnctl init`.
# The fingerprint is the SHA-256 of the certificate (64 hex chars).
[identity]
cert = "/etc/vibepn/certs/node1.crt"
key  = "/etc/vibepn/certs/node1.key"
fingerprint = "abcd1234ef567890abcd1234ef567890abcd1234ef567890abcd1234ef567890"

# Peers: nodes this daemon dials. `fingerprint` is optional; when empty the
# peer's identity is pinned on first connect (TOFU). `networks` restricts
# which networks this peer may announce routes for.
[[peers]]
name = "node2"
address = "203.0.113.42:51820"
fingerprint = "f00dbabe12345678deadbeef12345678f00dbabe12345678deadbeef12345678"
networks = ["corp"]

# Networks: one TUN device per network. `address = "auto"` derives a
# deterministic host address from the node fingerprint and network name.
# `export = true` advertises the prefix to peers.
[networks.corp]
prefix = "10.42.0.0/24"
address = "auto"
export = true

[networks.local]
prefix = "10.99.0.0/24"
address = "auto"
export = false